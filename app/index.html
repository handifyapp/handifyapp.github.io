<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handify im App Store</title>
  <meta name="description" content="Handify für iPhone und iPad: getippter Text in deiner eigenen Handschrift.">
  <link rel="canonical" href="https://handifyapp.github.io/">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Hierher führt der QR-Code auf den Visitenkarten, damit er gültig
    // bleibt, auch wenn sich der Link zur App einmal ändert. Sobald
    // Handify im App Store ist: imAppStore = true, dann geht es direkt dorthin.
    const imAppStore = true;
    const appStore = 'https://apps.apple.com/de/app/handify/id6825266673';
    if (imAppStore) location.replace(appStore);
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" width="28" height="28">
        Handify
      </a>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <img src="/apple-touch-icon.png" alt="" width="96" height="96" style="border-radius: 22px">
      <p class="eyebrow">Für iPhone und iPad</p>
      <h1>Handify</h1>
      <p class="lead">Getippter Text in deiner eigenen Handschrift. <span id="bald">Demnächst im App Store.</span></p>
      <div class="actions">
        <a class="button" id="store" href="https://apps.apple.com/de/app/handify/id6825266673" hidden>Im App Store laden</a>
        <a class="button secondary" href="/">Mehr über Handify</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© 2026 Handify</span>
      <nav aria-label="Rechtliches">
        <a href="/#hilfe">Hilfe</a>
        <a href="/datenschutz/">Datenschutz</a>
        <a href="/impressum/">Impressum</a>
      </nav>
    </div>
  </footer>
  <script>
    if (imAppStore) {
      document.getElementById('store').hidden = false;
      document.getElementById('bald').hidden = true;
    }
  </script>
</body>
</html>
